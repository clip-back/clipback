name: App Validation

on:
  pull_request:
    branches:
      - main
    paths:
      - frontend/**
      - .github/workflows/app-validation.yml
  push:
    branches:
      - main
    paths:
      - frontend/**
      - .github/workflows/app-validation.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # 같은 PR의 새 실행만 이전 실행을 취소한다. push·수동 실행은 커밋별로 나눠 서로 취소하지 않는다.
  group: app-validation-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: frontend

jobs:
  # 명령은 로컬 verify.py --only app과 같다.
  app:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          # 로컬 개발 SDK와 같은 버전으로 고정한다. 올릴 때 frontend/README.md도 함께 고친다.
          flutter-version: 3.47.9
          channel: stable
          cache: true
      - name: Show Flutter version
        run: flutter --version
      - name: Get dependencies
        run: flutter pub get --enforce-lockfile
      - name: Analyze
        run: flutter analyze --no-pub
      - name: Test
        run: flutter test --no-pub
