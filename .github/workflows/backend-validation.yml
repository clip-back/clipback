name: Backend Validation

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  schedule:
    # 매일 04:00 KST. 경로 판정으로 건너뛴 작업까지 전체를 실행한다.
    - cron: "0 19 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # 이벤트 종류를 넣어 예약·수동 실행과 main push 실행이 서로 취소하지 않게 한다.
  group: backend-validation-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: backend

env:
  APP_ENVIRONMENT: test
  YOUTUBE_SUMMARY_ENABLED: "false"
  SECRET_KEY: ci-backend-validation-secret
  STORAGE_ROOT: /tmp/clipback-storage

jobs:
  # deployment·operator-recovery의 PR·main push 실행 여부를 바뀐 경로로 판정한다.
  # operator_recovery 목록의 근거는 docs/history/2026-11-01-backend-ci-paths.md에 있다.
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      deployment: ${{ steps.filter.outputs.deployment }}
      operator_recovery: ${{ steps.filter.outputs.operator_recovery }}
    steps:
      - uses: actions/checkout@v6
        if: github.event_name == 'push'
      - id: filter
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            deployment:
              - .github/workflows/backend-validation.yml
              - backend/**
            operator_recovery:
              - .github/workflows/backend-validation.yml
              - backend/Dockerfile*
              - backend/.dockerignore
              - backend/pyproject.toml
              - backend/alembic.ini
              - backend/alembic/**
              - backend/scripts/**
              - backend/tests/conftest.py
              - backend/tests/deployment/**
              - backend/app/**/__init__.py
              - backend/app/main.py
              - backend/app/operator.py
              - backend/app/api/deps.py
              - backend/app/api/operator_maintenance.py
              - backend/app/api/v1/endpoints/health.py
              - backend/app/middleware/**
              - backend/app/models/**
              - backend/app/core/config.py
              - backend/app/core/deletion_ledger_config.py
              - backend/app/core/exceptions.py
              - backend/app/core/logging.py
              - backend/app/core/operator_source_config.py
              - backend/app/core/security.py
              - backend/app/core/storage_health.py
              - backend/app/db/base.py
              - backend/app/db/session.py
              - backend/app/db/types.py
              - backend/app/integrations/deletion_ledger.py
              - backend/app/integrations/operator_source.py
              - backend/app/integrations/storage_client.py
              - backend/app/repositories/auth_session_repository.py
              - backend/app/repositories/category_repository.py
              - backend/app/repositories/content_repository.py
              - backend/app/repositories/user_repository.py
              - backend/app/schemas/category.py
              - backend/app/schemas/content.py
              - backend/app/schemas/feed.py
              - backend/app/schemas/recommendation.py
              - backend/app/schemas/tag.py
              - backend/app/services/image_deletion_service.py
              - backend/app/services/image_storage_control.py
              - backend/app/services/maintenance.py

  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check app scripts alembic tests

  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Test
        run: pytest -q
      - name: Compile
        run: python -m compileall app scripts alembic tests

  migration:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: clipback_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d clipback_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/clipback_test
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/clipback_test
      MAINTENANCE_TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/clipback_maintenance100
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Upgrade database
        run: alembic upgrade head
      - name: Create dedicated maintenance test database
        run: |
          python - <<'PY'
          import asyncio
          import asyncpg

          async def create():
              connection = await asyncpg.connect(
                  "postgresql://postgres:postgres@localhost:5432/postgres"
              )
              try:
                  await connection.execute("CREATE DATABASE clipback_maintenance100")
              finally:
                  await connection.close()

          asyncio.run(create())
          PY
      - name: Upgrade dedicated maintenance database
        run: DATABASE_URL="$MAINTENANCE_TEST_DATABASE_URL" alembic upgrade head
      - name: Check migration state
        run: |
          alembic check
          DATABASE_URL="$MAINTENANCE_TEST_DATABASE_URL" alembic check
      - name: Test PostgreSQL repositories and API integration
        run: pytest -q tests/repositories tests/integration


  deployment:
    needs: changes
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || needs.changes.outputs.deployment == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build runtime image
        run: docker build --label org.opencontainers.image.revision=${{ github.sha }} -t clipback-backend:check .
      - name: Pull PostgreSQL
        run: docker pull postgres:16
      - name: Check container persistence and paired restore
        run: python scripts/check_deployment.py --image clipback-backend:check
      - name: Install deployment test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Build matching operator image
        run: docker build --build-arg POSTGRES_MAJOR=16 --label org.opencontainers.image.revision=${{ github.sha }} -f Dockerfile.operator -t clipback-ledger-operator:check .
      - name: Check ledger bootstrap and local API handoff
        env:
          RUN_DOCKER_RECOVERY_TESTS: "1"
          CLIPBACK_HANDOFF_API_IMAGE: clipback-backend:check
          CLIPBACK_LEDGER_OPERATOR_IMAGE: clipback-ledger-operator:check
          CLIPBACK_HANDOFF_REVISION: ${{ github.sha }}
        run: pytest -q tests/deployment/test_deletion_bootstrap_docker.py tests/deployment/test_image_handoff_docker.py


  operator-recovery:
    needs: changes
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || needs.changes.outputs.operator_recovery == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install recovery test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Pull isolated recovery dependencies
        run: |
          docker pull postgres:16
          docker pull postgres:18
          docker pull motoserver/moto:5.2.4
      - name: Build matching API and PostgreSQL 18 operator images
        run: |
          docker build --label org.opencontainers.image.revision=${{ github.sha }} -t clipback-operator-api:check .
          docker build --build-arg POSTGRES_MAJOR=18 --label org.opencontainers.image.revision=${{ github.sha }} -f Dockerfile.operator -t clipback-operator-pg18:check .
      - name: Check private source backup, maintenance and isolated recovery
        env:
          RUN_DOCKER_RECOVERY_TESTS: "1"
          CLIPBACK_SOURCE_API_IMAGE: clipback-operator-api:check
          CLIPBACK_SOURCE_API_TEST_IMAGE: clipback-operator-api:check
          CLIPBACK_OPERATOR_TEST_IMAGE: clipback-operator-pg18:check
          CLIPBACK_RECOVERY_TEST_IMAGE: clipback-operator-api:check
          CLIPBACK_RECOVERY_POSTGRES_MAJOR: "18"
          CLIPBACK_RECOVERY_OPERATOR_IMAGE: clipback-operator-pg18:check
        run: |
          pytest -q \
            tests/deployment/test_manual_backup_docker.py \
            tests/deployment/test_remote_source_backup_docker.py \
            tests/deployment/test_maintenance_docker.py \
            tests/deployment/test_live_restore_docker.py \
            tests/deployment/test_image_backup_docker.py \
            tests/deployment/test_multiuser_image_restore_docker.py \
            tests/deployment/test_backup_restore_docker.py \
            tests/deployment/test_postgres_restore_ready_docker.py
