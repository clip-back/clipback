name: Backend Validation

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: backend

env:
  APP_ENVIRONMENT: test
  YOUTUBE_SUMMARY_ENABLED: "false"
  SECRET_KEY: ci-backend-validation-secret
  STORAGE_ROOT: /tmp/clipback-storage

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check app scripts alembic tests

  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Test
        run: pytest -q
      - name: Compile
        run: python -m compileall app scripts alembic tests

  migration:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: clipback_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d clipback_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/clipback_test
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/clipback_test
      MAINTENANCE_TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/clipback_maintenance100
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Upgrade database
        run: alembic upgrade head
      - name: Create dedicated maintenance test database
        run: |
          python - <<'PY'
          import asyncio
          import asyncpg

          async def create():
              connection = await asyncpg.connect(
                  "postgresql://postgres:postgres@localhost:5432/postgres"
              )
              try:
                  await connection.execute("CREATE DATABASE clipback_maintenance100")
              finally:
                  await connection.close()

          asyncio.run(create())
          PY
      - name: Upgrade dedicated maintenance database
        run: DATABASE_URL="$MAINTENANCE_TEST_DATABASE_URL" alembic upgrade head
      - name: Check migration state
        run: |
          alembic check
          DATABASE_URL="$MAINTENANCE_TEST_DATABASE_URL" alembic check
      - name: Test PostgreSQL repositories and API integration
        run: pytest -q tests/repositories tests/integration


  deployment:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build runtime image
        run: docker build --label org.opencontainers.image.revision=${{ github.sha }} -t clipback-backend:check .
      - name: Pull PostgreSQL
        run: docker pull postgres:16
      - name: Check container persistence and paired restore
        run: python scripts/check_deployment.py --image clipback-backend:check
      - name: Install deployment test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Build matching operator image
        run: docker build --build-arg POSTGRES_MAJOR=16 --label org.opencontainers.image.revision=${{ github.sha }} -f Dockerfile.operator -t clipback-ledger-operator:check .
      - name: Check ledger bootstrap and local API handoff
        env:
          RUN_DOCKER_RECOVERY_TESTS: "1"
          CLIPBACK_HANDOFF_API_IMAGE: clipback-backend:check
          CLIPBACK_LEDGER_OPERATOR_IMAGE: clipback-ledger-operator:check
          CLIPBACK_HANDOFF_REVISION: ${{ github.sha }}
        run: pytest -q tests/deployment/test_deletion_bootstrap_docker.py tests/deployment/test_image_handoff_docker.py


  operator-recovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install recovery test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Pull isolated recovery dependencies
        run: |
          docker pull postgres:16
          docker pull postgres:18
          docker pull motoserver/moto:5.2.4
      - name: Build matching API and PostgreSQL 18 operator images
        run: |
          docker build --label org.opencontainers.image.revision=${{ github.sha }} -t clipback-operator-api:check .
          docker build --build-arg POSTGRES_MAJOR=18 --label org.opencontainers.image.revision=${{ github.sha }} -f Dockerfile.operator -t clipback-operator-pg18:check .
      - name: Check private source backup, maintenance and isolated recovery
        env:
          RUN_DOCKER_RECOVERY_TESTS: "1"
          CLIPBACK_SOURCE_API_IMAGE: clipback-operator-api:check
          CLIPBACK_SOURCE_API_TEST_IMAGE: clipback-operator-api:check
          CLIPBACK_OPERATOR_TEST_IMAGE: clipback-operator-pg18:check
          CLIPBACK_RECOVERY_TEST_IMAGE: clipback-operator-api:check
          CLIPBACK_RECOVERY_POSTGRES_MAJOR: "18"
          CLIPBACK_RECOVERY_OPERATOR_IMAGE: clipback-operator-pg18:check
        run: |
          pytest -q \
            tests/deployment/test_manual_backup_docker.py \
            tests/deployment/test_remote_source_backup_docker.py \
            tests/deployment/test_maintenance_docker.py \
            tests/deployment/test_live_restore_docker.py \
            tests/deployment/test_image_backup_docker.py \
            tests/deployment/test_multiuser_image_restore_docker.py \
            tests/deployment/test_backup_restore_docker.py \
            tests/deployment/test_postgres_restore_ready_docker.py
