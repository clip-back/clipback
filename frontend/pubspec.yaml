name: clipback_frontend
description: Clipback mobile frontend.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  file_picker: ^8.1.7
  flutter_svg: ^2.3.0
  google_sign_in: ^7.2.0
  http: ^1.5.0
  kakao_flutter_sdk_user: ^2.0.1
  shared_preferences: ^2.5.3
  sign_in_with_apple: ^8.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/figma/
    - assets/icons/
    - assets/fonts/Pretendard-LICENSE.txt
    - assets/fonts/RiaSans-LICENSE.pdf
  fonts:
    - family: Pretendard
      fonts:
        - asset: assets/fonts/Pretendard-Regular.otf
          weight: 400
        - asset: assets/fonts/Pretendard-Medium.otf
          weight: 500
        - asset: assets/fonts/Pretendard-SemiBold.otf
          weight: 600
    - family: PretendardDetail
      fonts:
        - asset: assets/fonts/Pretendard-Bold.otf
          weight: 700
    - family: RiaSansLogin
      fonts:
        - asset: assets/fonts/RiaSans-Regular.otf
          weight: 400
